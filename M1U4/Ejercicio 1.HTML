    <!DOCTYPE html>

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title></title>
</head>

<body>
    <script>
        metros = parseInt(prompt('Ingrese Metros:', ''));

        if (metros >=0 && metros <=1000) { // || OR
            document.write('A pie');
        } else if (metros<=10000) {
            document.write('Bicicleta');
        } else if (metros <=30000) {
            document.write('Colectivo');
        } else if(metros <=100000) {
            document.write('Auto');
        } else {
            document.write('Avion');
        }
    </script>

</body>
