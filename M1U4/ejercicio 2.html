<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=import java.util.Scanner;

    public class NumeroMayorBasico {
    
        public static void main(String[] args) {
            Scanner scanner = new Scanner(System.in);
    
            // Pedimos cuántos números se van a ingresar
            System.out.print("¿Cuántos números vas a ingresar? ");
            int cantidad = scanner.nextInt();
    
            int mayor = Integer.MIN_VALUE;  // Inicializamos con el menor entero posible
    
            // Usamos un bucle para pedir los números uno por uno
            for (int i = 1; i <= cantidad; i++) {
                System.out.print("Ingresa el número " + i + ": ");
                int numero = scanner.nextInt();
    
                // Verificamos si el número ingresado es mayor que el actual
                if (numero > mayor) {
                    mayor = numero;
                }
            }
    
            System.out.println("El número mayor es: " + mayor);
        }
    }
    , initial-scale=1.0">
    <title>Document</title>
</head>

</body>
</html>
